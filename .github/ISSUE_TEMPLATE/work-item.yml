name: Work item
description: Define a bounded InfrastructureIntent implementation or engineering task.
title: ""
labels: []
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What outcome should this issue produce?
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Relevant architecture, milestone, dependency, or background.

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable conditions that define completion.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: architecture
    attributes:
      label: Architecture impact
      description: Identify affected contracts/boundaries or state None.

  - type: textarea
    id: validation
    attributes:
      label: Validation expectations
      description: Tests, conformance checks, generated docs, packaging, or other required evidence.
