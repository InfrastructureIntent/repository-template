name: Bug
description: Report incorrect InfrastructureIntent behavior.
title: ""
labels: []
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: What behavior is incorrect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal deterministic steps or input required to reproduce the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / diagnostics

  - type: textarea
    id: versions
    attributes:
      label: Versions / contract generations
      description: Include relevant Engine, Adapter, Integration, Backend, Target, or package versions.

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, test output, artifacts, or other non-secret evidence.
